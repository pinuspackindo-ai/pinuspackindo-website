<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#fefce8"/>
    </linearGradient>
    <linearGradient id="clockRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="s3_5"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#22c55e18"/></filter>
    <filter id="s2_5"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000010"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>

  <!-- bg blobs -->
  <circle cx="1100" cy="80" r="190" fill="#fde68a" fill-opacity="0.28"/>
  <circle cx="950" cy="580" r="130" fill="#bbf7d0" fill-opacity="0.28"/>
  <circle cx="50" cy="500" r="100" fill="#d1fae5" fill-opacity="0.35"/>

  <!-- ── RIGHT: CLOCK ── -->
  <g transform="translate(620, 30)" filter="url(#s3_5)">
    <!-- Clock shadow -->
    <ellipse cx="270" cy="276" rx="248" ry="248" fill="#22c55e" fill-opacity="0.06"/>
    <!-- Clock outer ring -->
    <circle cx="270" cy="276" r="238" fill="white" stroke="#e7f9ee" stroke-width="3"/>
    <!-- Decorative ring -->
    <circle cx="270" cy="276" r="225" fill="none" stroke="#dcfce7" stroke-width="12"/>
    <!-- Inner clock face -->
    <circle cx="270" cy="276" r="210" fill="#f8fff9" stroke="#bbf7d0" stroke-width="2"/>

    <!-- Open arc 08:00–21:00 (same calculation as before, long clockwise arc) -->
    <!-- 08:00 on clock face = 8*30 - 90 = 150° → point: 270+210*cos(150°), 276+210*sin(150°) = 270-181.8, 276+105 = 88.2, 381 -->
    <!-- 21:00 = 9 on face = 9*30-90=180° → 270+210*cos(180°),276+210*sin(180°) = 270-210,276 = 60, 276 -->
    <!-- Large arc clockwise from 08 to 21 (330° arc) -->
    <path d="M 88.2 381 A 210 210 0 1 1 60 276" fill="none" stroke="url(#arcGrad)" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
    <path d="M 88.2 381 A 210 210 0 1 1 60 276" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Endpoints -->
    <circle cx="88" cy="381" r="12" fill="#fbbf24" stroke="white" stroke-width="3"/>
    <circle cx="60" cy="276" r="12" fill="#22c55e" stroke="white" stroke-width="3"/>

    <!-- Hour markers -->
    <g font-family="Arial" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">
      <text x="270" y="94">12</text>
      <text x="368" y="122">1</text>
      <text x="432" y="200">2</text>
      <text x="455" y="283">3</text>
      <text x="432" y="366">4</text>
      <text x="368" y="440">5</text>
      <text x="270" y="472">6</text>
      <text x="175" y="440">7</text>
      <text x="112" y="366" fill="#fbbf24">8</text>
      <text x="88" y="283" fill="#22c55e">9</text>
      <text x="112" y="200">10</text>
      <text x="175" y="122">11</text>
    </g>

    <!-- Tick marks -->
    <g stroke="#e5e7eb" stroke-width="2">
      <line x1="270" y1="68" x2="270" y2="84"/>
      <line x1="360" y1="94" x2="351" y2="108"/>
      <line x1="424" y1="167" x2="412" y2="175"/>
      <line x1="448" y1="276" x2="432" y2="276"/>
      <line x1="424" y1="385" x2="412" y2="377"/>
      <line x1="360" y1="458" x2="351" y2="444"/>
      <line x1="270" y1="484" x2="270" y2="468"/>
      <line x1="180" y1="458" x2="189" y2="444"/>
      <line x1="116" y1="385" x2="128" y2="377"/>
      <line x1="92" y1="276" x2="108" y2="276"/>
      <line x1="116" y1="167" x2="128" y2="175"/>
      <line x1="180" y1="94" x2="189" y2="108"/>
    </g>

    <!-- Hour hand → pointing to ~8 position (150°) -->
    <line x1="270" y1="276" x2="167" y2="381" stroke="#374151" stroke-width="7" stroke-linecap="round"/>
    <!-- Minute hand → pointing to 12 (straight up) -->
    <line x1="270" y1="276" x2="270" y2="110" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
    <!-- Second hand -->
    <line x1="270" y1="276" x2="330" y2="140" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>

    <!-- Center knob -->
    <circle cx="270" cy="276" r="14" fill="#374151"/>
    <circle cx="270" cy="276" r="7" fill="#22c55e"/>

    <!-- Time labels at endpoints -->
    <text x="68" y="402" font-family="Arial" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">08:00</text>
    <text x="38" y="272" font-family="Arial" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="end">21:00</text>

    <!-- BUKA badge inside clock -->
    <rect x="196" y="310" width="148" height="38" rx="19" fill="#22c55e"/>
    <text x="270" y="334" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white" letter-spacing="1">BUKA SETIAP HARI 🎉</text>
  </g>

  <!-- ── LEFT TEXT ── -->
  <rect x="60" y="60" width="170" height="30" rx="15" fill="#22c55e"/>
  <text x="145" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">🕗 JAM OPERASIONAL</text>
  <text x="247" y="79" font-family="Arial" font-size="12" fill="#bbb">12 Juni 2026</text>

  <text x="60" y="152" font-family="Arial" font-size="40" font-weight="800" fill="#111">Pinus Packindo</text>
  <text x="60" y="200" font-family="Arial" font-size="40" font-weight="800" fill="#111">Buka</text>
  <text x="60" y="248" font-family="Arial" font-size="40" font-weight="800" fill="#22c55e">Setiap Hari! 🎉</text>

  <line x1="60" y1="272" x2="490" y2="272" stroke="#22c55e" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- Big time display -->
  <text x="60" y="340" font-family="Arial" font-size="58" font-weight="900" fill="#111" letter-spacing="-1">08.00</text>
  <text x="248" y="332" font-family="Arial" font-size="26" fill="#9ca3af">–</text>
  <text x="280" y="340" font-family="Arial" font-size="58" font-weight="900" fill="#22c55e" letter-spacing="-1">21.00</text>

  <text x="60" y="370" font-family="Arial" font-size="13" fill="#9ca3af">Senin s.d. Minggu · Libur Nasional tetap buka</text>

  <!-- 3 channel cards -->
  <g transform="translate(60,392)" filter="url(#s2_5)">
    <rect x="0" y="0" width="142" height="72" rx="16" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="71" y="26" text-anchor="middle" font-family="Arial" font-size="26">🏪</text>
    <text x="71" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#111">Toko Langsung</text>
    <text x="71" y="64" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">Jl. Penjawi No.11, Pati</text>

    <rect x="158" y="0" width="142" height="72" rx="16" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="229" y="26" text-anchor="middle" font-family="Arial" font-size="26">💬</text>
    <text x="229" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#111">WhatsApp</text>
    <text x="229" y="64" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">0852-8333-8989</text>

    <rect x="316" y="0" width="142" height="72" rx="16" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="387" y="26" text-anchor="middle" font-family="Arial" font-size="26">📦</text>
    <text x="387" y="50" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#111">Kirim Hari Ini</text>
    <text x="387" y="64" text-anchor="middle" font-family="Arial" font-size="9" fill="#aaa">Order sebelum 17.00</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="596" width="1200" height="34" fill="#f0fdf4" opacity="0.9"/>
  <rect x="0" y="596" width="6" height="34" fill="#22c55e"/>
  <text x="22" y="618" font-family="Arial" font-size="12" fill="#aaa">Pinus Packindo · pinuspackindo.com</text>
  <text x="1175" y="618" text-anchor="end" font-family="Arial" font-size="12" fill="#22c55e" font-weight="bold">pinuspackindo.com</text>
</svg>
