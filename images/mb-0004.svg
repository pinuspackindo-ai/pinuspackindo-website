<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#ecfdf5"/>
    </linearGradient>
    <linearGradient id="trendLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="40%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="barUp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="barDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="s2_4"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000010"/></filter>
    <filter id="s3_4"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#22c55e14"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- bg blobs -->
  <circle cx="1100" cy="80" r="180" fill="#bbf7d0" fill-opacity="0.3"/>
  <circle cx="950" cy="570" r="130" fill="#a7f3d0" fill-opacity="0.2"/>
  <circle cx="60" cy="540" r="90" fill="#d1fae5" fill-opacity="0.3"/>

  <!-- ── RIGHT: BAR CHART ── -->
  <g transform="translate(595, 44)" filter="url(#s3_4)">
    <rect x="0" y="0" width="555" height="510" rx="24" fill="white" stroke="#f0fdf4" stroke-width="1.5"/>

    <text x="278" y="36" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Indeks Harga Plastik (PE/PP) · 2026</text>
    <text x="278" y="56" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">Jan 2026 = 100 · Jul–Des = proyeksi</text>

    <!-- Grid -->
    <g stroke="#f9fafb" stroke-width="1">
      <line x1="55" y1="80" x2="530" y2="80"/>
      <line x1="55" y1="130" x2="530" y2="130"/>
      <line x1="55" y1="180" x2="530" y2="180"/>
      <line x1="55" y1="230" x2="530" y2="230"/>
      <line x1="55" y1="280" x2="530" y2="280"/>
      <line x1="55" y1="330" x2="530" y2="330"/>
      <line x1="55" y1="380" x2="530" y2="380"/>
    </g>
    <line x1="55" y1="380" x2="530" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>
    <line x1="55" y1="80" x2="55" y2="380" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Bars: Jan=100, Feb=118, Mar=148, Apr=168, Mei=178(peak), Jun=158, Jul=140, Ags=122, Sep=108, Des=100 -->
    <!-- chart h = 300px (y80..y380). 200 pts = 300px → scale = 1.5px/pt. 0→y380 -->
    <!-- bar_h = val*1.5, bar_y = 380 - val*1.5 -->
    <!-- Jan: 100→150px, y=230 -->
    <rect x="65" y="230" width="38" height="150" rx="8" fill="url(#barUp)"/>
    <text x="84" y="224" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">100</text>
    <text x="84" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Jan</text>

    <!-- Feb: 118→177px, y=203 -->
    <rect x="113" y="203" width="38" height="177" rx="8" fill="url(#barUp)"/>
    <text x="132" y="197" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">118</text>
    <text x="132" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Feb</text>

    <!-- Mar: 148→222px, y=158 -->
    <rect x="161" y="158" width="38" height="222" rx="8" fill="url(#barUp)"/>
    <text x="180" y="152" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">148</text>
    <text x="180" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Mar</text>

    <!-- Apr: 168→252px, y=128 -->
    <rect x="209" y="128" width="38" height="252" rx="8" fill="url(#barUp)"/>
    <text x="228" y="122" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">168</text>
    <text x="228" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Apr</text>

    <!-- Mei: 178→267px, y=113 PEAK -->
    <rect x="257" y="100" width="38" height="280" rx="8" fill="#ef4444"/>
    <rect x="245" y="86" width="62" height="22" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="276" y="101" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#ef4444">▲ PUNCAK</text>
    <text x="276" y="395" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Mei</text>

    <!-- Jun: 158→237px, y=143 TURUN -->
    <rect x="305" y="143" width="38" height="237" rx="8" fill="url(#barMid)"/>
    <text x="324" y="137" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#d97706">158</text>
    <text x="324" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e" font-weight="bold">Jun ↓</text>

    <!-- Jul: 140→210px, y=170 -->
    <rect x="353" y="170" width="38" height="210" rx="8" fill="url(#barMid)"/>
    <text x="372" y="164" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#d97706">140</text>
    <text x="372" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Jul ↓</text>

    <!-- Ags: 122→183px, y=197 -->
    <rect x="401" y="197" width="38" height="183" rx="8" fill="url(#barDown)"/>
    <text x="420" y="191" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#16a34a">122</text>
    <text x="420" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Ags ↓</text>

    <!-- Sep: 108→162px, y=218 -->
    <rect x="449" y="218" width="38" height="162" rx="8" fill="url(#barDown)"/>
    <text x="468" y="212" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#16a34a">108</text>
    <text x="468" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#9ca3af">Sep ↓</text>

    <!-- Des: 100→150px, y=230 -->
    <rect x="497" y="230" width="38" height="150" rx="8" fill="url(#barDown)" filter="url(#s2_4)"/>
    <text x="516" y="224" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#16a34a">100</text>
    <text x="516" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#22c55e" font-weight="bold">Des ✓</text>

    <!-- Trend arrow overlay -->
    <polyline points="84,230 132,203 180,158 228,128 276,100 324,143 372,170 420,197 468,218 516,230"
      fill="none" stroke="url(#trendLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- Big down arrow -->
    <text x="516" y="175" text-anchor="middle" font-family="Arial" font-size="28">📉</text>

    <!-- 3 stat boxes -->
    <g transform="translate(28, 422)">
      <rect x="0" y="0" width="155" height="62" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="78" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Turun dari puncak</text>
      <text x="78" y="44" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#22c55e">−11,2%</text>

      <rect x="170" y="0" width="155" height="62" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="248" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Target akhir 2026</text>
      <text x="248" y="44" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#3b82f6">= 100</text>

      <rect x="340" y="0" width="155" height="62" rx="14" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
      <text x="418" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Kecepatan turun</text>
      <text x="418" y="44" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#ca8a04">−8 poin/bln</text>
    </g>
  </g>

  <!-- ── LEFT TEXT ── -->
  <rect x="60" y="60" width="136" height="30" rx="15" fill="#22c55e"/>
  <text x="128" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">📉 UPDATE HARGA</text>
  <text x="211" y="79" font-family="Arial" font-size="12" fill="#bbb">12 Juni 2026</text>

  <text x="60" y="152" font-family="Arial" font-size="42" font-weight="800" fill="#111">Harga Plastik</text>
  <text x="60" y="202" font-family="Arial" font-size="42" font-weight="800" fill="#111">Mulai</text>
  <text x="60" y="252" font-family="Arial" font-size="42" font-weight="800" fill="#22c55e">Turun 📉</text>

  <line x1="60" y1="278" x2="490" y2="278" stroke="#22c55e" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <text x="60" y="310" font-family="Arial" font-size="15" fill="#6b7280">Setelah mencapai puncak Mei 2026,</text>
  <text x="60" y="332" font-family="Arial" font-size="15" fill="#6b7280">indeks harga PE/PP kini bergerak</text>
  <text x="60" y="354" font-family="Arial" font-size="15" fill="#6b7280">turun bertahap ke level normal.</text>

  <!-- stat chips left -->
  <g transform="translate(60,380)" filter="url(#s2_4)">
    <rect x="0" y="0" width="138" height="64" rx="14" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="69" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#aaa">PE turun</text>
    <text x="69" y="50" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#22c55e">−11%</text>

    <rect x="154" y="0" width="138" height="64" rx="14" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="223" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#aaa">PP turun</text>
    <text x="223" y="50" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#22c55e">−9,6%</text>
  </g>

  <text x="60" y="484" font-family="Arial" font-size="32">🎉 📦 ✅</text>
  <text x="60" y="512" font-family="Arial" font-size="13" fill="#aaa">Target kembali normal: Akhir 2026</text>

  <!-- Bottom strip -->
  <rect x="0" y="596" width="1200" height="34" fill="#f0fdf4" opacity="0.9"/>
  <rect x="0" y="596" width="6" height="34" fill="#22c55e"/>
  <text x="22" y="618" font-family="Arial" font-size="12" fill="#aaa">Pinus Packindo · pinuspackindo.com</text>
  <text x="1175" y="618" text-anchor="end" font-family="Arial" font-size="12" fill="#22c55e" font-weight="bold">pinuspackindo.com</text>
</svg>
