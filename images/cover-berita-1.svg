<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#1a0a00"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c0392b"/>
      <stop offset="50%" style="stop-color:#e67e22"/>
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9d6f"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Red glow center-right -->
  <ellipse cx="820" cy="315" rx="320" ry="280" fill="url(#glowRed)"/>

  <!-- Grid lines subtle -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- ── FIRE / EXPLOSION right side ── -->
  <!-- Flame group -->
  <g opacity="0.9">
    <!-- Main flame -->
    <ellipse cx="920" cy="500" rx="55" ry="20" fill="#c0392b" opacity="0.5"/>
    <path d="M870 500 Q875 420 910 380 Q895 430 930 390 Q915 445 950 400 Q935 460 960 430 Q950 490 970 500 Z" fill="url(#fireGrad)" filter="url(#glow)"/>
    <!-- Second flame -->
    <path d="M900 500 Q905 440 930 415 Q920 455 945 425 Q938 468 960 450 Q952 490 965 500 Z" fill="#f39c12" opacity="0.7"/>
    <!-- Spark particles -->
    <circle cx="890" cy="380" r="3" fill="#f39c12" opacity="0.9"/>
    <circle cx="975" cy="360" r="2" fill="#e67e22" opacity="0.8"/>
    <circle cx="940" cy="345" r="4" fill="#f1c40f" opacity="0.7"/>
    <circle cx="855" cy="395" r="2.5" fill="#e74c3c" opacity="0.9"/>
    <circle cx="1005" cy="390" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="985" cy="355" r="2" fill="#f1c40f"/>
    <circle cx="865" cy="355" r="3" fill="#e67e22" opacity="0.8"/>
    <circle cx="1020" cy="420" r="2" fill="#e74c3c" opacity="0.9"/>
    <!-- Smoke -->
    <ellipse cx="920" cy="355" rx="40" ry="25" fill="#1a1a1a" opacity="0.6" filter="url(#blur)"/>
    <ellipse cx="930" cy="320" rx="35" ry="22" fill="#2c2c2c" opacity="0.5" filter="url(#blur)"/>
  </g>

  <!-- ── GLOBE / MAP silhouette ── -->
  <g transform="translate(750, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="140" fill="#1a0505" opacity="0.6"/>
    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-opacity="0.25"/>
    <ellipse cx="0" cy="-70" rx="120" ry="30" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-opacity="0.2"/>
    <ellipse cx="0" cy="70" rx="120" ry="30" fill="none" stroke="#e74c3c" stroke-width="0.8" stroke-opacity="0.2"/>
    <!-- Longitude -->
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#e74c3c" stroke-width="0.8" stroke-opacity="0.25"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#e74c3c" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- Middle East landmass simplified -->
    <path d="M-10 -60 L30 -50 L55 -30 L60 0 L45 20 L20 35 L-5 30 L-20 10 L-15 -20 Z" fill="#c0392b" opacity="0.5"/>
    <!-- Iran highlight -->
    <path d="M30 -50 L60 -40 L75 -15 L60 0 L45 20 L20 35 L10 15 L25 -5 L40 -20 Z" fill="#e74c3c" opacity="0.7"/>
    <!-- USA landmass (top-left of globe) -->
    <path d="M-100 -60 L-60 -70 L-30 -65 L-20 -45 L-50 -30 L-90 -35 Z" fill="#3498db" opacity="0.4"/>

    <!-- War flash between USA and Iran -->
    <path d="M-55 -45 L-20 -30 L5 -5 L30 -25 L20 -50 L-10 -55 Z" fill="#f39c12" opacity="0.3"/>
    <line x1="-55" y1="-45" x2="30" y2="-25" stroke="#f1c40f" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.7"/>

    <!-- Explosion dot on Iran -->
    <circle cx="45" cy="-10" r="8" fill="#e74c3c" filter="url(#glow)" opacity="0.9"/>
    <circle cx="45" cy="-10" r="4" fill="#f1c40f"/>
  </g>

  <!-- ── BROKEN SUPPLY CHAIN ── -->
  <!-- Factory icon left side -->
  <g transform="translate(80, 320)" opacity="0.7">
    <rect x="0" y="30" width="100" height="70" rx="4" fill="#2c3e50" stroke="#4a6741" stroke-width="1.5"/>
    <rect x="10" y="10" width="20" height="30" rx="2" fill="#2c3e50" stroke="#4a6741" stroke-width="1.5"/>
    <rect x="40" y="0" width="20" height="40" rx="2" fill="#2c3e50" stroke="#4a6741" stroke-width="1.5"/>
    <rect x="70" y="15" width="20" height="25" rx="2" fill="#2c3e50" stroke="#4a6741" stroke-width="1.5"/>
    <!-- Smoke from factory - red tint -->
    <ellipse cx="20" cy="5" rx="10" ry="7" fill="#e74c3c" opacity="0.3" filter="url(#blur)"/>
    <ellipse cx="50" cy="-10" rx="10" ry="7" fill="#e74c3c" opacity="0.3" filter="url(#blur)"/>
    <!-- Windows -->
    <rect x="15" y="45" width="12" height="12" rx="1" fill="#f39c12" opacity="0.6"/>
    <rect x="45" y="45" width="12" height="12" rx="1" fill="#f39c12" opacity="0.3"/>
    <rect x="72" y="45" width="12" height="12" rx="1" fill="#f39c12" opacity="0.5"/>
    <text x="50" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#4a9d6f" opacity="0.8">PABRIK PLASTIK</text>
  </g>

  <!-- Arrow broken -->
  <g opacity="0.8">
    <line x1="195" y1="355" x2="270" y2="355" stroke="#27ae60" stroke-width="3" stroke-dasharray="10,5"/>
    <!-- Break mark -->
    <line x1="260" y1="340" x2="278" y2="370" stroke="#e74c3c" stroke-width="3"/>
    <line x1="278" y1="340" x2="260" y2="370" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="269" cy="355" r="12" fill="none" stroke="#e74c3c" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Pellets scattered - some missing/gone -->
  <g>
    <!-- Full pellets (available) -->
    <ellipse cx="330" cy="320" rx="14" ry="9" fill="url(#pelletGrad)" opacity="0.9"/>
    <ellipse cx="360" cy="338" rx="14" ry="9" fill="url(#pelletGrad)" opacity="0.9"/>
    <ellipse cx="350" cy="308" rx="12" ry="8" fill="url(#pelletGrad)" opacity="0.8"/>
    <!-- Fading/disappearing pellets -->
    <ellipse cx="395" cy="325" rx="14" ry="9" fill="url(#pelletGrad)" opacity="0.5"/>
    <ellipse cx="425" cy="340" rx="14" ry="9" fill="url(#pelletGrad)" opacity="0.3"/>
    <ellipse cx="415" cy="312" rx="12" ry="8" fill="url(#pelletGrad)" opacity="0.2"/>
    <!-- Ghost outlines - empty -->
    <ellipse cx="460" cy="325" rx="14" ry="9" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
    <ellipse cx="490" cy="340" rx="14" ry="9" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.3"/>
    <ellipse cx="480" cy="312" rx="12" ry="8" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.2"/>
    <!-- Pellet label -->
    <text x="410" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#27ae60" opacity="0.7">Bijih Plastik</text>
    <text x="410" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#e74c3c" opacity="0.8">▼ LANGKA</text>
  </g>

  <!-- Price arrow up -->
  <g transform="translate(530, 280)" opacity="0.85">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="#1a0505" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">HARGA</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial Bold" font-size="22" fill="#e74c3c" font-weight="bold">↑</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c" font-weight="bold">+35%</text>
    <text x="40" y="115" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">per kuartal</text>
  </g>

  <!-- ── LEFT SIDE: TEXT CONTENT ── -->
  <!-- Category badge -->
  <rect x="60" y="60" width="90" height="28" rx="14" fill="#e74c3c"/>
  <text x="105" y="79" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white" letter-spacing="1">BERITA</text>

  <!-- Date -->
  <text x="165" y="79" font-family="Arial" font-size="12" fill="#888">12 Juni 2026</text>

  <!-- Main headline -->
  <text x="60" y="145" font-family="Arial" font-size="38" font-weight="bold" fill="white">Kelangkaan Bijih</text>
  <text x="60" y="195" font-family="Arial" font-size="38" font-weight="bold" fill="white">Plastik Imbas</text>
  <text x="60" y="245" font-family="Arial" font-size="38" font-weight="bold" fill="#e74c3c">Konflik Iran–AS</text>

  <!-- Divider -->
  <line x1="60" y1="268" x2="500" y2="268" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="60" y="300" font-family="Arial" font-size="16" fill="#aaa">Pasokan petrokimia terganggu, harga kemasan</text>
  <text x="60" y="322" font-family="Arial" font-size="16" fill="#aaa">plastik berpotensi naik signifikan di Indonesia.</text>

  <!-- Impact stats -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="130" height="65" rx="8" fill="#1a1a1a" stroke="#e74c3c" stroke-width="1" stroke-opacity="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Produksi Petrokimia</text>
    <text x="65" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#e74c3c">-40%</text>
    <text x="65" y="60" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Iran (proyeksi)</text>
  </g>
  <g transform="translate(205, 360)">
    <rect x="0" y="0" width="130" height="65" rx="8" fill="#1a1a1a" stroke="#f39c12" stroke-width="1" stroke-opacity="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Harga Polyethylene</text>
    <text x="65" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f39c12">+35%</text>
    <text x="65" y="60" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Kuartal ini</text>
  </g>
  <g transform="translate(350, 360)">
    <rect x="0" y="0" width="130" height="65" rx="8" fill="#1a1a1a" stroke="#3498db" stroke-width="1" stroke-opacity="0.5"/>
    <text x="65" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Stok Global</text>
    <text x="65" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#3498db">KRITIS</text>
    <text x="65" y="60" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">Warning level</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0d0d0d"/>
  <rect x="0" y="590" width="5" height="40" fill="#e74c3c"/>
  <text x="25" y="615" font-family="Arial" font-size="12" fill="#555">Sumber: Reuters · Bloomberg · Kemenperin RI</text>
  <text x="1140" y="615" text-anchor="end" font-family="Arial" font-size="12" fill="#27ae60" font-weight="bold">pinuspackindo.com</text>
</svg>
