<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="dropshadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00000015"/>
    </filter>
    <filter id="cardshadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg1)"/>

  <!-- Decorative soft blobs -->
  <circle cx="1080" cy="90" r="200" fill="#fed7aa" fill-opacity="0.3"/>
  <circle cx="980" cy="570" r="140" fill="#fde68a" fill-opacity="0.22"/>
  <circle cx="55" cy="520" r="95" fill="#fecdd3" fill-opacity="0.18"/>

  <!-- ===== RIGHT SIDE: GLOBE ===== -->
  <g transform="translate(620, 50)" filter="url(#dropshadow)">
    <!-- Ocean -->
    <circle cx="265" cy="265" r="228" fill="url(#oceanGrad)" stroke="#7dd3fc" stroke-width="3"/>

    <!-- Latitude lines -->
    <g stroke="#bae6fd" stroke-width="1.5" fill="none" opacity="0.6">
      <ellipse cx="265" cy="265" rx="228" ry="57"/>
      <ellipse cx="265" cy="265" rx="228" ry="114"/>
      <ellipse cx="265" cy="265" rx="228" ry="171"/>
      <line x1="37" y1="265" x2="493" y2="265"/>
      <line x1="265" y1="37" x2="265" y2="493"/>
    </g>

    <!-- Continents -->
    <!-- Americas -->
    <ellipse cx="155" cy="240" rx="56" ry="90" fill="#86efac" fill-opacity="0.85"/>
    <!-- Europe -->
    <ellipse cx="262" cy="175" rx="34" ry="26" fill="#86efac" fill-opacity="0.7"/>
    <!-- Asia blob -->
    <ellipse cx="340" cy="205" rx="82" ry="68" fill="#86efac" fill-opacity="0.85"/>
    <!-- Africa -->
    <ellipse cx="272" cy="330" rx="40" ry="58" fill="#86efac" fill-opacity="0.7"/>

    <!-- USA pill -->
    <rect x="114" y="202" width="70" height="32" rx="16" fill="#60a5fa"/>
    <text x="149" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">USA</text>

    <!-- Iran pill -->
    <rect x="308" y="195" width="68" height="32" rx="16" fill="#fb923c"/>
    <text x="342" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Iran</text>

    <!-- Dotted arrow between them -->
    <path d="M 184 218 Q 265 160 308 211" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="7,5" stroke-linecap="round"/>

    <!-- Lightning bolt emoji area (text) -->
    <text x="263" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">⚡</text>

    <!-- Globe bottom shadow -->
    <ellipse cx="265" cy="487" rx="185" ry="15" fill="#f97316" fill-opacity="0.07"/>
  </g>

  <!-- ===== LEFT SIDE: TEXT ===== -->

  <!-- Badge -->
  <rect x="60" y="62" width="88" height="30" rx="15" fill="#ef4444"/>
  <text x="104" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">BERITA</text>
  <text x="165" y="81" font-family="Arial, sans-serif" font-size="12" fill="#bbb">12 Juni 2026</text>

  <!-- Headline -->
  <text x="60" y="148" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111">Kelangkaan</text>
  <text x="60" y="198" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111">Bahan Baku</text>
  <text x="60" y="248" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#f97316">Plastik Global</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#f97316">Imbas Iran–AS</text>

  <!-- Divider line -->
  <line x1="60" y1="314" x2="490" y2="314" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Description -->
  <text x="60" y="344" font-family="Arial, sans-serif" font-size="15" fill="#888">Pasokan petrokimia global terganggu.</text>
  <text x="60" y="366" font-family="Arial, sans-serif" font-size="15" fill="#888">Harga kemasan plastik berpotensi naik</text>
  <text x="60" y="388" font-family="Arial, sans-serif" font-size="15" fill="#888">15–25% dalam waktu dekat.</text>

  <!-- Stat chips -->
  <!-- Chip 1 -->
  <rect x="60" y="416" width="142" height="70" rx="16" fill="white" stroke="#fee2e2" stroke-width="1.5" filter="url(#cardshadow)"/>
  <text x="131" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Produksi Iran</text>
  <text x="131" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ef4444">-40%</text>

  <!-- Chip 2 -->
  <rect x="218" y="416" width="142" height="70" rx="16" fill="white" stroke="#fef3c7" stroke-width="1.5" filter="url(#cardshadow)"/>
  <text x="289" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Harga PE Global</text>
  <text x="289" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#f59e0b">+35%</text>

  <!-- Chip 3 -->
  <rect x="376" y="416" width="142" height="70" rx="16" fill="white" stroke="#fee2e2" stroke-width="1.5" filter="url(#cardshadow)"/>
  <text x="447" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Status Stok</text>
  <text x="447" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ef4444">KRITIS</text>

  <!-- Emoji row -->
  <text x="60" y="536" font-family="Arial, sans-serif" font-size="30">🌏  📦  ⚠️</text>

  <!-- Bottom strip -->
  <rect x="0" y="596" width="1200" height="34" fill="#fff7ed" opacity="0.9"/>
  <rect x="0" y="596" width="6" height="34" fill="#f97316"/>
  <text x="22" y="618" font-family="Arial, sans-serif" font-size="12" fill="#ccc">Pinus Packindo · pinuspackindo.com</text>
  <text x="1175" y="618" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#f97316" font-weight="bold">pinuspackindo.com</text>
</svg>
