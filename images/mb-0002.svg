<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f1"/>
      <stop offset="100%" style="stop-color:#fffbf5"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="s2b"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000010"/></filter>
    <filter id="s3b"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00000014"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- bg blobs -->
  <circle cx="1100" cy="120" r="180" fill="#fde68a" fill-opacity="0.25"/>
  <circle cx="1000" cy="580" r="130" fill="#fecdd3" fill-opacity="0.2"/>
  <circle cx="50" cy="540" r="110" fill="#e9d5ff" fill-opacity="0.2"/>

  <!-- ── RIGHT: BAR CHART ── -->
  <g transform="translate(610, 50)" filter="url(#s3b)">
    <rect x="0" y="0" width="540" height="500" rx="24" fill="white" stroke="#f0f0f0" stroke-width="1.5"/>

    <text x="270" y="38" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Kenaikan Harga Kemasan 2026</text>
    <text x="270" y="58" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">dibanding awal tahun (Jan 2026 = 100%)</text>

    <!-- Grid lines -->
    <g stroke="#f3f4f6" stroke-width="1">
      <line x1="60" y1="90" x2="510" y2="90"/>
      <line x1="60" y1="150" x2="510" y2="150"/>
      <line x1="60" y1="210" x2="510" y2="210"/>
      <line x1="60" y1="270" x2="510" y2="270"/>
      <line x1="60" y1="330" x2="510" y2="330"/>
      <line x1="60" y1="390" x2="510" y2="390"/>
    </g>

    <!-- X-axis -->
    <line x1="60" y1="390" x2="510" y2="390" stroke="#e5e7eb" stroke-width="2"/>

    <!-- Bars: PE +78%, PP +65%, PVC +48%, Kertas +13% -->
    <!-- chart height = 300px (y90..y390). 100% = 300px. -->
    <!-- PE: 78% → 234px. bar_y = 390-234=156 -->
    <rect x="80" y="156" width="80" height="234" rx="10" fill="url(#bar3)"/>
    <text x="120" y="148" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#ef4444">+78%</text>
    <text x="120" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">PE</text>

    <!-- PP: 65% → 195px. bar_y = 390-195=195 -->
    <rect x="195" y="195" width="80" height="195" rx="10" fill="url(#bar2)"/>
    <text x="235" y="187" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#f97316">+65%</text>
    <text x="235" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">PP</text>

    <!-- PVC: 48% → 144px. bar_y = 390-144=246 -->
    <rect x="310" y="246" width="80" height="144" rx="10" fill="url(#bar1)"/>
    <text x="350" y="238" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#d97706">+48%</text>
    <text x="350" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">PVC</text>

    <!-- Kertas: 13% → 39px. bar_y = 390-39=351 -->
    <rect x="425" y="351" width="80" height="39" rx="10" fill="url(#bar4)"/>
    <text x="465" y="343" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#a855f7">+13%</text>
    <text x="465" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">Kertas</text>

    <!-- Y labels -->
    <g font-family="Arial" font-size="10" fill="#d1d5db" text-anchor="end">
      <text x="54" y="94">100%</text>
      <text x="54" y="154">80%</text>
      <text x="54" y="214">60%</text>
      <text x="54" y="274">40%</text>
      <text x="54" y="334">20%</text>
      <text x="54" y="394">0%</text>
    </g>

    <!-- 3 stat boxes -->
    <g transform="translate(30, 430)">
      <rect x="0" y="0" width="148" height="50" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
      <text x="74" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Harga PE saat ini</text>
      <text x="74" y="38" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#f97316">Rp 27.000/kg</text>

      <rect x="162" y="0" width="148" height="50" rx="12" fill="#fef9c3" stroke="#fde68a" stroke-width="1.5"/>
      <text x="236" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Rata-rata kenaikan</text>
      <text x="236" y="38" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ca8a04">+51% avg</text>

      <rect x="324" y="0" width="148" height="50" rx="12" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
      <text x="398" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#9ca3af">Dampak ke UMKM</text>
      <text x="398" y="38" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ec4899">Signifikan</text>
    </g>
  </g>

  <!-- ── LEFT TEXT ── -->
  <rect x="60" y="60" width="132" height="30" rx="15" fill="#f97316"/>
  <text x="126" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">ANALISIS PASAR</text>
  <text x="209" y="79" font-family="Arial" font-size="12" fill="#bbb">12 Juni 2026</text>

  <text x="60" y="148" font-family="Arial" font-size="40" font-weight="800" fill="#111">Harga Kemasan</text>
  <text x="60" y="196" font-family="Arial" font-size="40" font-weight="800" fill="#111">Plastik</text>
  <text x="60" y="244" font-family="Arial" font-size="40" font-weight="800" fill="#f97316">Melonjak</text>

  <!-- Big percent number -->
  <text x="60" y="334" font-family="Arial" font-size="96" font-weight="900" fill="#f97316" fill-opacity="0.12">78%</text>
  <text x="60" y="320" font-family="Arial" font-size="72" font-weight="900" fill="#ef4444">+78%</text>
  <text x="60" y="355" font-family="Arial" font-size="15" fill="#888">kenaikan tertinggi (PE) sejak Jan 2026</text>

  <line x1="60" y1="378" x2="490" y2="378" stroke="#f97316" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <text x="60" y="405" font-family="Arial" font-size="14" fill="#aaa">Penyesuaian harga oleh Pinus Packindo</text>
  <text x="60" y="424" font-family="Arial" font-size="14" fill="#aaa">dilakukan bertahap &amp; transparan.</text>

  <!-- Emoji row -->
  <text x="60" y="475" font-family="Arial" font-size="32">📦 📈 💡</text>

  <!-- Bottom strip -->
  <rect x="0" y="596" width="1200" height="34" fill="#fff8f1" opacity="0.9"/>
  <rect x="0" y="596" width="6" height="34" fill="#f97316"/>
  <text x="22" y="618" font-family="Arial" font-size="12" fill="#ccc">Pinus Packindo · pinuspackindo.com</text>
  <text x="1175" y="618" text-anchor="end" font-family="Arial" font-size="12" fill="#f97316" font-weight="bold">pinuspackindo.com</text>
</svg>
