<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="s3g"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#16a34a18"/></filter>
    <filter id="s2g"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000010"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- bg blobs -->
  <circle cx="1100" cy="100" r="200" fill="#bbf7d0" fill-opacity="0.35"/>
  <circle cx="900" cy="580" r="140" fill="#a7f3d0" fill-opacity="0.25"/>
  <circle cx="50" cy="480" r="90" fill="#d1fae5" fill-opacity="0.4"/>

  <!-- ── RIGHT: SHIELD + WAVE ── -->
  <g transform="translate(600, 40)">
    <!-- Big shield -->
    <g filter="url(#s3g)">
      <path d="M280 20 L480 20 L510 60 L510 240 Q510 370 280 430 Q50 370 50 240 L50 60 Z" fill="url(#shieldGrad)"/>
      <path d="M280 50 L460 50 L485 82 L485 236 Q485 350 280 402 Q75 350 75 236 L75 82 Z" fill="#16a34a" fill-opacity="0.4"/>
      <!-- Big checkmark -->
      <path d="M165 230 L235 305 L400 170" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Shield label -->
    <text x="280" y="460" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#15803d" letter-spacing="2">TERKENDALI ✓</text>

    <!-- Wave chart below shield -->
    <rect x="0" y="490" width="560" height="120" rx="16" fill="white" filter="url(#s2g)"/>
    <text x="280" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#6b7280">PROYEKSI STABILISASI · Jan → Des 2026</text>

    <!-- Wave line -->
    <polyline points="30,590 100,568 170,538 240,522 310,526 380,546 450,563 530,572"
      fill="none" stroke="url(#waveG)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="30,600 30,590 100,568 170,538 240,522 310,526 380,546 450,563 530,572 530,600"
      fill="url(#waveG)" fill-opacity="0.08"/>

    <!-- Peak dot -->
    <circle cx="240" cy="522" r="6" fill="#f59e0b"/>
    <text x="240" y="512" text-anchor="middle" font-family="Arial" font-size="9" fill="#d97706" font-weight="bold">PUNCAK</text>

    <!-- Now marker -->
    <line x1="310" y1="490" x2="310" y2="600" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="310" cy="526" r="5" fill="#22c55e"/>
    <text x="310" y="484" text-anchor="middle" font-family="Arial" font-size="9" fill="#16a34a" font-weight="bold">SEKARANG</text>

    <!-- x labels -->
    <g font-family="Arial" font-size="9" fill="#d1d5db" text-anchor="middle">
      <text x="30" y="610">Jan</text>
      <text x="170" y="610">Mar</text>
      <text x="310" y="610">Jun</text>
      <text x="450" y="610">Sep</text>
      <text x="530" y="610">Des</text>
    </g>
  </g>

  <!-- ── LEFT TEXT ── -->
  <rect x="60" y="60" width="172" height="30" rx="15" fill="#22c55e"/>
  <text x="146" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">📢 PERNYATAAN RESMI</text>
  <text x="248" y="79" font-family="Arial" font-size="12" fill="#aaa">12 Juni 2026</text>

  <text x="60" y="152" font-family="Arial" font-size="46" font-weight="800" fill="#111">Jangan</text>
  <text x="60" y="204" font-family="Arial" font-size="46" font-weight="800" fill="#111">Panik! 😊</text>
  <text x="60" y="258" font-family="Arial" font-size="32" font-weight="800" fill="#16a34a">Situasi Akan</text>
  <text x="60" y="300" font-family="Arial" font-size="32" font-weight="800" fill="#16a34a">Segera Pulih</text>

  <line x1="60" y1="322" x2="490" y2="322" stroke="#22c55e" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <text x="60" y="352" font-family="Arial" font-size="15" fill="#4b5563">Pinus Packindo memastikan pasokan</text>
  <text x="60" y="374" font-family="Arial" font-size="15" fill="#4b5563">kemasan tetap tersedia. Krisis ini</text>
  <text x="60" y="396" font-family="Arial" font-size="15" fill="#4b5563">bersifat sementara.</text>

  <!-- 3 mini chips -->
  <g transform="translate(60,420)" filter="url(#s2g)">
    <rect x="0" y="0" width="140" height="62" rx="14" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" font-family="Arial" font-size="20">🛡</text>
    <text x="70" y="44" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#16a34a">Stok Aman</text>

    <rect x="156" y="0" width="140" height="62" rx="14" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="226" y="22" text-anchor="middle" font-family="Arial" font-size="20">💚</text>
    <text x="226" y="44" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#16a34a">Harga Stabil</text>

    <rect x="312" y="0" width="140" height="62" rx="14" fill="white" stroke="#dcfce7" stroke-width="1.5"/>
    <text x="382" y="22" text-anchor="middle" font-family="Arial" font-size="20">⏱</text>
    <text x="382" y="44" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#16a34a">Pulih 3–6 Bln</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="596" width="1200" height="34" fill="#f0fdf4" opacity="0.9"/>
  <rect x="0" y="596" width="6" height="34" fill="#22c55e"/>
  <text x="22" y="618" font-family="Arial" font-size="12" fill="#aaa">Pinus Packindo · pinuspackindo.com</text>
  <text x="1175" y="618" text-anchor="end" font-family="Arial" font-size="12" fill="#22c55e" font-weight="bold">pinuspackindo.com</text>
</svg>
