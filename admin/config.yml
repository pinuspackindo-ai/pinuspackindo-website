backend:
  name: github
  repo: pinuspackindo-ai/pinuspackindo-website
  branch: main
  base_url: https://pinuspackindo.com
  auth_endpoint: api/auth

media_folder: "images"
public_folder: "/images"

locale: id

collections:
  - name: "berita"
    label: "📰 Berita & Acara"
    folder: "_berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — 📷 mb-{{kode}}"
    fields:
      - {label: "🇮🇩 Judul (Indonesia)", name: "title", widget: "string"}
      - {label: "🇬🇧 Judul (English)", name: "title_en", widget: "string", required: false, hint: "Terjemahan judul ke bahasa Inggris"}
      - {label: "Kategori", name: "category", widget: "string", default: "Berita"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Kode Foto (mb-XXXX)", name: "kode", widget: "string", required: false, hint: "Isi kode foto, contoh: 0001 → foto akan bernama mb-0001.svg di folder images/"}
      - {label: "🇮🇩 Ringkasan (Indonesia)", name: "summary", widget: "text"}
      - {label: "🇬🇧 Ringkasan (English)", name: "summary_en", widget: "text", required: false}
      - {label: "🇮🇩 Konten (Indonesia)", name: "body", widget: "markdown"}
      - {label: "🇬🇧 Konten (English)", name: "body_en", widget: "markdown", required: false, hint: "Terjemahan isi ke bahasa Inggris. Susun paragraf/judul dengan urutan SAMA seperti versi Indonesia."}

  - name: "artikel"
    label: "📝 Artikel"
    folder: "_artikel"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — 📷 ma-{{kode}}"
    fields:
      - {label: "🇮🇩 Judul (Indonesia)", name: "title", widget: "string"}
      - {label: "🇬🇧 Judul (English)", name: "title_en", widget: "string", required: false, hint: "Terjemahan judul ke bahasa Inggris"}
      - {label: "Kategori", name: "category", widget: "string", default: "Tips"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Kode Foto (ma-XXXX)", name: "kode", widget: "string", required: false, hint: "Isi kode foto, contoh: 0001 → foto akan bernama ma-0001.png di folder images/"}
      - {label: "🇮🇩 Ringkasan (Indonesia)", name: "summary", widget: "text"}
      - {label: "🇬🇧 Ringkasan (English)", name: "summary_en", widget: "text", required: false}
      - {label: "🇮🇩 Konten (Indonesia)", name: "body", widget: "markdown"}
      - {label: "🇬🇧 Konten (English)", name: "body_en", widget: "markdown", required: false, hint: "Terjemahan isi ke bahasa Inggris. Susun paragraf/judul dengan urutan SAMA seperti versi Indonesia."}

  - name: "produk"
    label: "📦 Produk"
    folder: "_produk"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — 📷 mp-{{kode}}"
    fields:
      - {label: "Nama Produk", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Kemasan Plastik", "Kemasan Kertas", "Kemasan Styrofoam", "Peralatan Baking", "Bahan Baking"]}
      - {label: "Kode Foto (mp-XXXX)", name: "kode", widget: "string", required: false, hint: "Isi kode foto, contoh: 0001 → foto akan bernama mp-0001.png di folder images/"}
      - {label: "Deskripsi", name: "description", widget: "text"}
      - {label: "Tersedia", name: "available", widget: "boolean", default: true}

  - name: "homepage"
    label: "🏠 Konten Homepage"
    files:
      - label: "Section 1 — Hero Slider"
        name: "section1"
        file: "_data/section1.json"
        fields:
          - {label: "Tag (atas judul)", name: "tag", widget: "string"}
          - {label: "Judul Utama", name: "title", widget: "string"}
          - {label: "Subjudul", name: "subtitle", widget: "text"}

      - label: "Section 2 — Produk & Layanan"
        name: "section2"
        file: "_data/section2.json"
        fields:
          - {label: "Judul Section", name: "title", widget: "string"}
          - {label: "Subjudul Section", name: "subtitle", widget: "text"}
          - label: "Kartu Produk"
            name: "cards"
            widget: "list"
            collapsed: true
            summary: "{{title}} — 📷 s2-{{kode}}"
            fields:
              - {label: "Judul Kartu", name: "title", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Kode Foto (s2-X)", name: "kode", widget: "string", hint: "Angka urutan foto, contoh: 1 → foto s2-1.png"}

      - label: "Section 3 — Tentang Kami"
        name: "section3"
        file: "_data/section3.json"
        fields:
          - {label: "Label (atas judul)", name: "label", widget: "string"}
          - {label: "Judul", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}

      - label: "Section 4 — Keunggulan Kami"
        name: "section4"
        file: "_data/section4.json"
        fields:
          - {label: "Judul Section", name: "title", widget: "string"}
          - {label: "Label (atas judul)", name: "label", widget: "string"}
          - {label: "Subjudul", name: "subtitle", widget: "text"}
          - label: "Kartu Keunggulan"
            name: "cards"
            widget: "list"
            collapsed: true
            summary: "{{title}} — 📷 s4-{{kode}}"
            fields:
              - {label: "Judul", name: "title", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Kode Foto (s4-X)", name: "kode", widget: "string", hint: "Angka urutan foto, contoh: 1 → foto s4-1.png"}

      - label: "Section 7 — Testimoni"
        name: "section7"
        file: "_data/section7.json"
        fields:
          - {label: "Judul", name: "title", widget: "string"}
          - {label: "Subjudul", name: "subtitle", widget: "text"}
          - label: "Daftar Testimoni"
            name: "testimonials"
            widget: "list"
            collapsed: true
            summary: "{{name}} — 📷 s7-{{kode}}"
            fields:
              - {label: "Kutipan", name: "quote", widget: "text"}
              - {label: "Nama", name: "name", widget: "string"}
              - {label: "Jabatan/Usaha", name: "role", widget: "string"}
              - {label: "Kode Foto (s7-X)", name: "kode", widget: "string", hint: "Angka urutan foto, contoh: 1 → foto s7-1.jpg"}

  - name: "settings"
    label: "⚙️ Pengaturan Website"
    files:
      - label: "Info Umum"
        name: "general"
        file: "_data/settings.json"
        fields:
          - {label: "Nama Perusahaan", name: "company_name", widget: "string", default: "Pinus Packindo"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Nomor WhatsApp CS", name: "whatsapp", widget: "string", default: "6285283338989"}
          - {label: "Alamat Toko", name: "address", widget: "text"}
          - {label: "Jam Operasional", name: "hours", widget: "string", default: "08.00 - 21.00"}
          - {label: "Instagram", name: "instagram", widget: "string"}
          - {label: "TikTok", name: "tiktok", widget: "string"}
