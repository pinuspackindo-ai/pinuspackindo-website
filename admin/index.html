<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>Admin Website | Pinus Packindo</title>
  <link rel="icon" type="image/jpeg" href="../images/logo.jpg">
  <script>
    // Paksa favicon tetap logo Pinus meski Sveltia override
    function forceFavicon() {
      const links = document.querySelectorAll("link[rel*='icon']");
      links.forEach(l => l.remove());
      const link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/jpeg';
      link.href = '../images/logo.jpg';
      document.head.appendChild(link);
    }
    forceFavicon();
    setInterval(forceFavicon, 1000);
    setInterval(() => { document.title = 'Admin Website | Pinus Packindo'; }, 500);
  </script>
  <!-- v4 -->
</head>
<body>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    /* ── Override Sveltia logo & app name via shadowRoot langsung ── */
    function overrideBranding() {
      // Target custom element <sveltia-cms> dan shadow root-nya
      var cmsEl = document.querySelector('sveltia-cms');
      var roots = [document];
      if (cmsEl && cmsEl.shadowRoot) roots.push(cmsEl.shadowRoot);

      roots.forEach(function(root) {
        // Ganti semua SVG
        root.querySelectorAll('svg').forEach(function(el) {
          if (el.getAttribute('data-pinus-replaced')) return;
          el.setAttribute('data-pinus-replaced', '1');
          var img = document.createElement('img');
          img.src = '/images/logo.jpg';
          img.alt = 'Pinus Packindo';
          img.style.cssText = 'width:96px;height:96px;object-fit:contain;border-radius:16px;display:block;margin:auto;';
          el.replaceWith(img);
        });
        // Ganti teks "Sveltia CMS"
        root.querySelectorAll('*').forEach(function(el) {
          if (el.children.length === 0 && el.textContent.trim() === 'Sveltia CMS') {
            el.textContent = 'Admin Website';
          }
        });
      });

      // Inject CSS ke shadow root untuk sembunyikan SVG yang lolos
      if (cmsEl && cmsEl.shadowRoot && !cmsEl.shadowRoot.querySelector('#pinus-style')) {
        var style = document.createElement('style');
        style.id = 'pinus-style';
        style.textContent = 'svg:not([data-pinus-replaced]) { display: none !important; }';
        cmsEl.shadowRoot.appendChild(style);
      }
    }
    var brandObserver = new MutationObserver(overrideBranding);
    brandObserver.observe(document.body, { childList: true, subtree: true });
    setInterval(overrideBranding, 300);
  </script>

  <script>
    /* ── Hide "Signed in as" ── */
    function hideSignedIn() {
      document.querySelectorAll('*').forEach(function(el) {
        if (el.textContent.trim().toLowerCase().startsWith('signed in as') && el.children.length === 0) {
          var parent = el.parentElement;
          if (parent) parent.style.display = 'none';
        }
      });
    }
    var observer = new MutationObserver(hideSignedIn);
    observer.observe(document.body, { childList: true, subtree: true });
    setInterval(hideSignedIn, 500);
  </script>

  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'pinuspackindo-ai/pinuspackindo-website',
          branch: 'main',
          base_url: 'https://pinuspackindo.com',
          auth_endpoint: 'api/auth',
        },
        media_folder: 'images',
        public_folder: '/images',
        locale: 'id',
      },
    });
  </script>
</body>
</html>
