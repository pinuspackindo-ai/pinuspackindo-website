<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>Admin | Pinus Packindo</title>
  <!-- v2 -->
  <style>
    /* ── Custom Delete Confirmation Modal ── */
    #pp-confirm-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,0.45);
      align-items: center; justify-content: center;
    }
    #pp-confirm-overlay.show { display: flex; }
    #pp-confirm-box {
      background: #fff; border-radius: 12px;
      padding: 28px 32px; max-width: 380px; width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      text-align: center;
      animation: pp-pop 0.18s ease;
    }
    @keyframes pp-pop {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #pp-confirm-box .pp-icon {
      font-size: 36px; margin-bottom: 12px; display: block;
    }
    #pp-confirm-box h3 {
      margin: 0 0 8px; font-size: 17px; font-weight: 700; color: #1a1a1a;
    }
    #pp-confirm-box p {
      margin: 0 0 24px; font-size: 14px; color: #666; line-height: 1.5;
    }
    #pp-confirm-box .pp-btns {
      display: flex; gap: 10px; justify-content: center;
    }
    #pp-confirm-box button {
      flex: 1; padding: 10px 0; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; transition: opacity 0.15s;
    }
    #pp-confirm-box button:hover { opacity: 0.85; }
    #pp-btn-cancel {
      background: #f0f0f0; color: #444;
    }
    #pp-btn-confirm {
      background: #e74c3c; color: #fff;
    }
  </style>
</head>
<body>

  <!-- Custom Delete Confirmation Modal -->
  <div id="pp-confirm-overlay">
    <div id="pp-confirm-box">
      <span class="pp-icon">🗑️</span>
      <h3 id="pp-confirm-title">Konfirmasi Hapus</h3>
      <p id="pp-confirm-msg">Yakin ingin menghapus item ini?<br>Tindakan ini <strong>tidak dapat dibatalkan</strong>.</p>
      <div class="pp-btns">
        <button id="pp-btn-cancel">Batalkan</button>
        <button id="pp-btn-confirm">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
    /* ── Hide "Signed in as" ── */
    function hideSignedIn() {
      document.querySelectorAll('*').forEach(function(el) {
        if (el.textContent.trim().toLowerCase().startsWith('signed in as') && el.children.length === 0) {
          var parent = el.parentElement;
          if (parent) parent.style.display = 'none';
        }
      });
    }
    var observer = new MutationObserver(hideSignedIn);
    observer.observe(document.body, { childList: true, subtree: true });
    setInterval(hideSignedIn, 500);
  </script>

  <script>
    /* ── Delete Confirmation Interceptor ── */
    var ppOverlay   = document.getElementById('pp-confirm-overlay');
    var ppTitle     = document.getElementById('pp-confirm-title');
    var ppMsg       = document.getElementById('pp-confirm-msg');
    var ppBtnCancel = document.getElementById('pp-btn-cancel');
    var ppBtnOk     = document.getElementById('pp-btn-confirm');

    // Kata kunci yang menandakan aksi hapus
    var DELETE_KEYWORDS = [
      'delete entry', 'delete', 'hapus', 'remove',
      'delete selected', 'delete asset', 'delete file',
      'delete image', 'delete media'
    ];

    function isDeleteTarget(el) {
      if (!el) return false;
      var tag    = (el.tagName || '').toLowerCase();
      var label  = (el.getAttribute('aria-label') || '').toLowerCase();
      var title  = (el.getAttribute('title') || '').toLowerCase();
      var role   = (el.getAttribute('role') || '').toLowerCase();
      var text   = (el.textContent || '').trim().toLowerCase();
      var isBtn  = tag === 'button' || tag === 'a' || role === 'menuitem' || role === 'button';

      if (!isBtn) return false;

      for (var i = 0; i < DELETE_KEYWORDS.length; i++) {
        var kw = DELETE_KEYWORDS[i];
        if (label === kw || title === kw || text === kw) return true;
      }
      return false;
    }

    function getDeleteContext(el) {
      // Tentukan pesan berdasarkan konteks
      var label = (el.getAttribute('aria-label') || el.textContent || '').toLowerCase();
      if (label.includes('asset') || label.includes('file') || label.includes('image') || label.includes('media')) {
        return {
          title: 'Hapus Foto / File?',
          msg: 'Yakin ingin menghapus foto atau file ini dari All Assets?<br>File akan <strong>terhapus permanen</strong> dari GitHub.'
        };
      }
      if (label.includes('entry') || label.includes('delete entry')) {
        return {
          title: 'Hapus Konten?',
          msg: 'Yakin ingin menghapus entri ini?<br>Data akan <strong>terhapus permanen</strong> dan tidak bisa dikembalikan.'
        };
      }
      // List item remove (tombol ×)
      return {
        title: 'Hapus Item dari Daftar?',
        msg: 'Yakin ingin menghapus item ini dari daftar?<br>Perubahan baru berlaku setelah klik <strong>Save</strong>.'
      };
    }

    function showConfirm(context, onOk) {
      ppTitle.textContent = context.title;
      ppMsg.innerHTML     = context.msg;
      ppOverlay.classList.add('show');

      function cleanup() {
        ppOverlay.classList.remove('show');
        ppBtnOk.removeEventListener('click', onYes);
        ppBtnCancel.removeEventListener('click', onNo);
      }
      function onYes() { cleanup(); onOk(); }
      function onNo()  { cleanup(); }

      ppBtnOk.addEventListener('click', onYes);
      ppBtnCancel.addEventListener('click', onNo);
    }

    // Flag bypass agar klik ulang setelah konfirmasi tidak ter-intercept lagi
    var ppBypassed = false;

    // Intercept klik pada tombol hapus (capture phase)
    document.addEventListener('click', function(e) {
      if (ppBypassed) return; // lewati interceptor setelah konfirmasi

      var el = e.target;

      // Cari elemen delete sampai 6 level ke atas
      for (var depth = 0; depth < 6; depth++) {
        if (!el || el === document.body) break;
        if (isDeleteTarget(el)) {
          e.stopImmediatePropagation();
          e.preventDefault();

          var ctx      = getDeleteContext(el);
          var targetEl = el;

          showConfirm(ctx, function() {
            // Jalankan klik asli setelah konfirmasi dengan bypass flag
            ppBypassed = true;
            targetEl.click();
            ppBypassed = false;
          });
          return;
        }
        el = el.parentElement;
      }
    }, true); // capture phase agar lebih awal dari handler Svelte

    // Tutup modal jika klik di luar box
    ppOverlay.addEventListener('click', function(e) {
      if (e.target === ppOverlay) ppOverlay.classList.remove('show');
    });
  </script>

  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'pinuspackindo-ai/pinuspackindo-website',
          branch: 'main',
          base_url: 'https://pinuspackindo.com',
          auth_endpoint: 'api/auth',
        },
        media_folder: 'images',
        public_folder: '/images',
        locale: 'id',
      },
    });
  </script>
</body>
</html>
